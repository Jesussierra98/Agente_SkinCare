AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ultra-skincare-frontend: CloudFront con OAC delante del bucket de hosting, política de bucket, redirección
  HTTP a HTTPS, TLS 1.2 mínimo (con dominio propio) y cabeceras de seguridad (Req. 21.6, 21.7, 21.10, 22.3).

Parameters:
  ProjectName:
    Type: String
    Default: ultra-skincare
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  StorageStackName:
    Type: String
    Default: ultra-skincare-storage
  ComputeStackName:
    Type: String
    Default: ultra-skincare-compute
  DomainName:
    Type: String
    Default: ''
    Description: >-
      Dominio propio de la tienda (por ejemplo tienda.ejemplo.com). CloudFront solo permite fijar
      TLSv1.2_2021 como mínimo con un certificado propio; sin dominio se usa el certificado de CloudFront,
      cuyo mínimo lo fija el servicio (Req. 21.10 queda sin cumplir hasta usar un dominio).
  CertificateArn:
    Type: String
    Default: ''
    Description: Certificado de ACM en us-east-1 para DomainName. Obligatorio si se indica DomainName.
  ImageSources:
    Type: String
    Default: 'https:'
    Description: >-
      Orígenes permitidos para img-src de la CSP, separados por espacio (por ejemplo https://cdn.ejemplo.com).
      Restringirlo a los hosts reales de las imágenes de producto.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]

Rules:
  DomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: Si indicas DomainName, indica también CertificateArn.

Resources:
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-hosting-oac'
        Description: Acceso de CloudFront al bucket de hosting.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-security-headers'
        Comment: Cabeceras de seguridad de la SPA (Kiosco y Caja).
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Join
              - '; '
              - - "default-src 'self'"
                - "script-src 'self'"
                - "style-src 'self' 'unsafe-inline'"
                - "font-src 'self'"
                - !Sub 'img-src ''self'' data: blob: ${ImageSources}'
                - !Join
                  - ' '
                  - - "connect-src 'self'"
                    - !Sub 'wss://bedrock-agentcore.${AWS::Region}.amazonaws.com'
                    - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com'
                    - !Sub
                      - 'https://${ApiHost}'
                      - ApiHost:
                          Fn::ImportValue: !Sub '${ComputeStackName}-ApiHost'
                - "media-src 'self' blob:"
                - "worker-src 'self' blob:"
                - "object-src 'none'"
                - "base-uri 'self'"
                - "form-action 'self'"
                - "frame-ancestors 'none'"
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Override: true
              Value: microphone=(self), camera=(self), geolocation=()

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          # CertificateArn vale '' por defecto y solo se usa con la condición HasDomain.
          ignore_checks: [W1030]
    Properties:
      DistributionConfig:
        Comment: !Sub '${ProjectName}: Kiosco y Caja'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If
          - HasDomain
          - [!Ref DomainName]
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: hosting
            DomainName:
              Fn::ImportValue: !Sub '${StorageStackName}-HostingBucketDomain'
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: hosting
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized (política administrada por AWS).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # La SPA resuelve /caja, /kiosk/setup y /derivacion/<id> en el navegador.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        Logging:
          Bucket:
            Fn::ImportValue: !Sub '${StorageStackName}-LogsBucketDomain'
          Prefix: cloudfront/
          IncludeCookies: false

  HostingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Fn::ImportValue: !Sub '${StorageStackName}-HostingBucketName'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SoloHTTPS
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - Fn::ImportValue: !Sub '${StorageStackName}-HostingBucketArn'
              - !Sub
                - '${Arn}/*'
                - Arn:
                    Fn::ImportValue: !Sub '${StorageStackName}-HostingBucketArn'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - Sid: LecturaSoloDeCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub
              - '${Arn}/*'
              - Arn:
                  Fn::ImportValue: !Sub '${StorageStackName}-HostingBucketArn'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  DistributionId:
    Value: !Ref Distribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'
  DistributionDomain:
    Description: Dominio de CloudFront (AllowedOrigin del stack compute = https://<este valor>).
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-DistributionDomain'
  SiteUrl:
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
