[tool.pytest.ini_options]
# Los paquetes del backend no son instalables: se agregan al path para las pruebas.
pythonpath = ["src/agent", "src/etl", "src/caja_api"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: pruebas contra la infraestructura desplegada (SKINCARE_INTEGRATION=1)",
]
